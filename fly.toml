# Fly.io app config.
#
# Storage: this app is configured for Supabase (DATABASE_URL + SUPABASE_URL +
# SUPABASE_SERVICE_KEY set as secrets) - Postgres + Storage are the system of
# record, not this machine's disk, so no [[mounts]] volume is needed here.
# If you ever unset those secrets, the app falls back to local SQLite/disk,
# but this config has no volume for that mode - see README > Deployment for
# how to add one back if needed.

app = "thermal-panel-inspector-leonw"
primary_region = "sea"

[build]

[env]
  PORT = "8000"
  SESSION_HTTPS_ONLY = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
