<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in — Thermal Panel Inspector</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1216;
    --panel: #171b21;
    --border: #2a2f37;
    --text: #e6e9ee;
    --muted: #9aa4b2;
    --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2rem;
    width: 20rem;
  }
  h1 { font-size: 1.2rem; margin: 0 0 1.25rem; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
  input {
    display: block;
    width: 100%;
    margin-top: 0.35rem;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 0.5rem 0.6rem;
  }
  button {
    width: 100%;
    background: var(--accent);
    color: #04121f;
    border: none;
    border-radius: 6px;
    padding: 0.6rem 1.2rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #error { color: #ff6b6b; font-size: 0.85rem; margin-top: 0.85rem; min-height: 1.1em; }
</style>
</head>
<body>
<form id="loginForm">
  <h1>Thermal Panel Inspector</h1>
  <label>Username
    <input type="text" id="username" autocomplete="username" required />
  </label>
  <label>Password
    <input type="password" id="password" autocomplete="current-password" required />
  </label>
  <button id="submitBtn" type="submit">Log in</button>
  <div id="error"></div>
</form>

<script>
const form = document.getElementById('loginForm');
const submitBtn = document.getElementById('submitBtn');
const errorEl = document.getElementById('error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  errorEl.textContent = '';

  const body = new FormData();
  body.append('username', document.getElementById('username').value);
  body.append('password', document.getElementById('password').value);

  try {
    const resp = await fetch('/api/login', { method: 'POST', body, credentials: 'same-origin' });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Login failed');
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = err.message;
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
