<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>History — Thermal Panel Inspector</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1216;
    --panel: #171b21;
    --border: #2a2f37;
    --text: #e6e9ee;
    --muted: #9aa4b2;
    --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1.25rem 4rem;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 1.25rem; }

  .topbar {
    max-width: 900px;
    margin: 0 auto 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .topbar .brand { color: var(--text); text-decoration: none; font-weight: 700; }
  .topbar nav { display: flex; align-items: center; gap: 1rem; font-size: 0.9rem; }
  .topbar nav a { color: var(--muted); text-decoration: none; }
  .topbar nav a:hover { color: var(--text); }
  .topbar .whoami { color: var(--muted); font-size: 0.85rem; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 6px;
    padding: 0.35rem 0.8rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  tr.run-row { cursor: pointer; }
  tr.run-row:hover { background: rgba(255,255,255,0.03); }

  .summary-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .badge { padding: 0.2rem 0.55rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .badge.minor { background: #4a4200; color: #ffe97a; }
  .badge.serious { background: #5a3200; color: #ffb45c; }
  .badge.critical { background: #5a0000; color: #ff7a7a; }
  .badge.critical_immediate { background: #4a0044; color: #ff7aff; }
  .badge.none { background: #1c2a1c; color: #9ad19a; }

  #detail { display: none; }
  #detail .image-block img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); }
  #detail .image-block { margin-bottom: 1.5rem; }
  #detail table.hotspots { margin-top: 0.5rem; }
  .image-pair { display: flex; gap: 1rem; flex-wrap: wrap; }
  .image-pair figure { margin: 0; flex: 1 1 260px; min-width: 220px; }
  .image-pair figcaption { font-size: 0.8rem; color: var(--muted); font-weight: 600; margin-bottom: 0.3rem; }
  tr.hotspot-excluded { opacity: 0.5; }
  tr.hotspot-excluded td:not(:first-child) { text-decoration: line-through; }
  .exclude-hint { font-size: 0.78rem; color: var(--muted); margin: 0.35rem 0 0; }

  .fields { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
  .fields label { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--muted); gap: 0.25rem; }
  .fields input, .fields select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 0.4rem 0.5rem; width: 9rem;
  }
  .fields input.wide { width: 14rem; }

  #backLink { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
</style>
</head>
<body>
<header class="topbar">
  <a href="/" class="brand">Thermal Panel Inspector</a>
  <nav>
    <a href="/">Analyze</a>
    <a href="/history">History</a>
    <a href="/admin" id="adminLink" style="display:none;">Admin</a>
    <span class="whoami" id="whoami"></span>
    <button id="logoutBtn" class="secondary">Log out</button>
  </nav>
</header>
<main>
  <h1>Analysis history</h1>

  <div class="panel" id="listPanel">
    <table id="runsTable">
      <thead>
        <tr><th>ID</th><th>When</th><th>By</th><th>Images</th><th>Findings</th></tr>
      </thead>
      <tbody id="runsBody"></tbody>
    </table>
    <div id="emptyMsg" style="display:none; color: var(--muted); margin-top: 0.5rem;">No analyses yet.</div>
  </div>

  <div class="panel" id="detail">
    <a id="backLink" href="#">&larr; Back to history</a>
    <h2 id="detailTitle" style="margin: 0.75rem 0 0.25rem;"></h2>
    <div id="detailMeta" style="color: var(--muted); font-size: 0.85rem; margin-bottom: 0.5rem;"></div>
    <div class="summary-badges" id="detailBadges" style="margin-bottom: 1rem;"></div>
    <div id="detailImages"></div>
    <div id="detailSkipped" style="font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem;"></div>

    <div class="section-label" style="text-transform: uppercase; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem;">Download report</div>
    <div class="fields">
      <label>Client name <input type="text" id="clientName" class="wide" placeholder="optional" /></label>
      <label>Site / location <input type="text" id="siteLocation" class="wide" placeholder="optional" /></label>
      <label>Audit date <input type="date" id="auditDate" /></label>
      <label>Inspector <input type="text" id="inspectorName" placeholder="optional" /></label>
      <label>Report ID <input type="text" id="reportId" placeholder="optional" /></label>
      <label>Report style
        <select id="reportStyle">
          <option value="full">Full (all detail)</option>
          <option value="audit">Audit (findings only)</option>
        </select>
      </label>
    </div>
    <button id="downloadBtn" style="margin-top: 1rem; background: var(--accent); color: #04121f; border: none; border-radius: 6px; padding: 0.6rem 1.2rem; font-weight: 600;">Download PDF</button>
    <button id="gdocBtn" class="secondary" style="margin-top: 1rem;">Export to Google Docs</button>
    <span id="downloadStatus" style="color: var(--muted); font-size: 0.85rem; margin-left: 0.5rem;"></span>

    <details style="margin-top: 1.5rem;">
      <summary style="cursor:pointer; text-transform: uppercase; font-size: 0.75rem; color: var(--muted); letter-spacing:0.04em;">Activity log</summary>
      <div id="auditLog" style="margin-top: 0.75rem; font-size: 0.85rem;"></div>
    </details>
  </div>
</main>

<dialog id="trendDialog" style="background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; max-width: 700px; width: 90vw;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.75rem;">
    <h3 id="trendTitle" style="margin:0;"></h3>
    <button id="trendCloseBtn" class="secondary">Close</button>
  </div>
  <div id="trendContent"></div>
</dialog>

<script>
const SEVERITY_ORDER = ['critical_immediate', 'critical', 'serious', 'minor'];
let currentRunId = null;
let currentUserRole = null;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
  window.location.href = '/login';
});

(async function initUser() {
  const resp = await fetch('/api/me', { credentials: 'same-origin' });
  if (!resp.ok) { window.location.href = '/login'; return; }
  const me = await resp.json();
  currentUserRole = me.role;
  document.getElementById('whoami').textContent = `${me.username} (${me.role})`;
  if (me.role === 'admin') document.getElementById('adminLink').style.display = '';
})();

async function setExcludedHotspots(runId, imageId, indices) {
  const resp = await fetch(`/api/history/${runId}/images/${imageId}/exclude`, {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ hotspot_indices: indices }),
  });
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    throw new Error(data.detail || 'Failed to update finding');
  }
  return resp.json();
}

async function setVisualNote(runId, imageId, note, anomaly, assetLabel) {
  const resp = await fetch(`/api/history/${runId}/images/${imageId}/note`, {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ note, anomaly, asset_label: assetLabel }),
  });
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    throw new Error(data.detail || 'Failed to save note');
  }
  return resp.json();
}

async function setEmissivityOverride(runId, imageId, hotspotIndex, emissivity) {
  const resp = await fetch(`/api/history/${runId}/images/${imageId}/recompute-emissivity`, {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ hotspot_index: hotspotIndex, emissivity }),
  });
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    throw new Error(data.detail || 'Failed to recompute');
  }
  return resp.json();
}

function badgesHtml(summary) {
  const counts = summary.counts_by_severity || {};
  const parts = SEVERITY_ORDER.filter((s) => counts[s]).map(
    (s) => `<span class="badge ${s}">${s.replace('_', ' ')}: ${counts[s]}</span>`
  );
  if (!parts.length) parts.push('<span class="badge none">clean</span>');
  return `<div class="summary-badges">${parts.join('')}</div>`;
}

async function loadRuns() {
  const resp = await fetch('/api/history', { credentials: 'same-origin' });
  const data = await resp.json();
  const tbody = document.getElementById('runsBody');
  tbody.innerHTML = '';
  document.getElementById('emptyMsg').style.display = data.runs.length ? 'none' : 'block';

  data.runs.forEach((run) => {
    const tr = document.createElement('tr');
    tr.className = 'run-row';
    const when = new Date(run.created_at).toLocaleString();
    tr.innerHTML = `
      <td>#${run.id}</td>
      <td>${when}</td>
      <td>${escapeHtml(run.created_by)}</td>
      <td>${run.image_count}</td>
      <td>${badgesHtml(run.summary)}</td>
    `;
    tr.addEventListener('click', () => showDetail(run.id));
    tbody.appendChild(tr);
  });
}

async function showDetail(runId) {
  const resp = await fetch(`/api/history/${runId}`, { credentials: 'same-origin' });
  if (!resp.ok) return;
  const run = await resp.json();
  currentRunId = run.id;

  document.getElementById('listPanel').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  document.getElementById('detailTitle').textContent = `Run #${run.id}`;
  const when = new Date(run.created_at).toLocaleString();
  const roiText = run.roi ? `ROI ${run.roi.join(',')}` : 'full frame';
  const loadText = run.load_percent != null ? ` · load ${run.load_percent}%` : '';
  document.getElementById('detailMeta').textContent =
    `${when} · by ${run.created_by} · ambient ${run.ambient_c ?? 'auto'} · min ΔT ${run.min_delta_c}°C · ${roiText}${loadText}`;
  document.getElementById('detailBadges').innerHTML = badgesHtml(run.summary);

  const canReview = currentUserRole === 'admin' || currentUserRole === 'inspector';

  const imagesEl = document.getElementById('detailImages');
  imagesEl.innerHTML = '';
  run.images.forEach((img) => {
    const block = document.createElement('div');
    block.className = 'image-block';
    const showLoad = img.hotspots.some((h) => h.delta_t_corrected_c !== null && h.delta_t_corrected_c !== undefined);
    const rowsHtml = img.hotspots.length
      ? `<table class="hotspots">
          <thead><tr>${canReview ? '<th>Not a fault</th>' : ''}<th>Severity</th><th>ΔT (°C)</th>${showLoad ? '<th>ΔT @ 100% load (°C)</th>' : ''}<th>Max (°C)</th><th>Mean (°C)</th><th>Area (px)</th><th>BBox</th>${canReview && img.can_recompute_emissivity ? '<th>Emissivity</th>' : ''}</tr></thead>
          <tbody>
            ${img.hotspots.map((h, i) => `
              <tr class="${h.excluded ? 'hotspot-excluded' : ''}">
                ${canReview ? `<td><input type="checkbox" class="exclude-checkbox" data-image-id="${img.id}" data-index="${i}" ${h.excluded ? 'checked' : ''} /></td>` : ''}
                <td>${h.severity}</td><td>${h.delta_t_c}</td>
                ${showLoad ? `<td>${h.delta_t_corrected_c ?? '-'}</td>` : ''}
                <td>${h.max_temp_c}</td>
                <td>${h.mean_temp_c}</td><td>${h.area_px}</td>
                <td>${h.bbox_x}, ${h.bbox_y}, ${h.bbox_w}, ${h.bbox_h}</td>
                ${canReview && img.can_recompute_emissivity ? `
                <td style="white-space:nowrap;">
                  <input type="number" class="emissivity-input" data-image-id="${img.id}" data-index="${i}" min="0.01" max="1" step="0.01" value="${h.emissivity_override ?? ''}" placeholder="e.g. 0.3" style="width:4.5rem;" />
                  <button class="recompute-btn secondary" data-image-id="${img.id}" data-index="${i}" style="padding:0.2rem 0.5rem; font-size:0.78rem;">Recompute</button>
                </td>` : ''}
              </tr>`).join('')}
          </tbody>
        </table>
        ${canReview ? `<p class="exclude-hint">Check "Not a fault" for anything that isn't a real electrical issue (a tool left in frame, bare reflective metal, etc.) - it's dropped from reports and counts${img.image_updates_on_exclude ? ', and the box is removed from the picture' : ''}.${img.can_recompute_emissivity ? ' Bare/tarnished metal reads artificially cool at a painted-surface emissivity (~0.95) - enter a lower value (~0.3-0.5) and Recompute to correct it.' : ''}</p>` : ''}`
      : `<p style="color: var(--muted); margin: 0.25rem 0 0;">No anomalies detected.</p>`;

    const comparative = img.comparative || [];
    const comparativeHtml = comparative.length
      ? `<p style="color: var(--muted); font-size: 0.85rem; margin: 0.75rem 0 0.25rem;">Comparative findings</p>
        <table class="hotspots">
          <thead><tr><th>Component</th><th>Severity</th><th>ΔT vs coolest peer (°C)</th><th>Max (°C)</th></tr></thead>
          <tbody>
            ${comparative.map((c) => `
              <tr>
                <td>${escapeHtml(c.label)}</td>
                <td>${c.severity || 'baseline / no flag'}</td>
                <td>${c.delta_t_c}</td>
                <td>${c.max_temp_c}</td>
              </tr>`).join('')}
          </tbody>
        </table>`
      : '';

    const photoHtml = img.photo_url
      ? `<figure><figcaption>Visual photo</figcaption><img src="${img.photo_url}" alt="Visual photo of ${escapeHtml(img.filename)}" /></figure>`
      : '';

    const noteHtml = canReview
      ? `<div class="visual-note-block" style="margin-top: 0.75rem;">
          <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.85rem; color: var(--text); margin-bottom:0.35rem;">
            <input type="checkbox" class="visual-anomaly-checkbox" data-image-id="${img.id}" ${img.visual_anomaly ? 'checked' : ''} />
            Flag as visual anomaly (non-thermal - e.g. physical damage, corrosion, a cracked enclosure)
          </label>
          <textarea class="visual-note-input" data-image-id="${img.id}" rows="2" style="width:100%; max-width:520px; font-family:inherit;" placeholder="Optional: describe what you observed...">${escapeHtml(img.visual_note || '')}</textarea>
          <br/>
          <label style="display:block; font-size:0.85rem; color: var(--muted); margin: 0.5rem 0 0.25rem;">Asset label (optional - tag this component to track it across visits)</label>
          <input type="text" class="asset-label-input" data-image-id="${img.id}" value="${escapeHtml(img.asset_label || '')}" placeholder="e.g. Main Panel - Breaker 3" style="width:100%; max-width:520px;" />
          <br/>
          <button class="save-note-btn secondary" data-image-id="${img.id}" style="margin-top:0.35rem;">Save</button>
          ${img.asset_label ? `<button class="view-trend-btn secondary" data-label="${escapeHtml(img.asset_label)}" style="margin-top:0.35rem;">View trend for "${escapeHtml(img.asset_label)}"</button>` : ''}
          <span class="note-status" data-image-id="${img.id}" style="font-size:0.8rem; color: var(--muted); margin-left:0.5rem;"></span>
        </div>`
      : img.visual_anomaly
        ? `<p style="margin-top:0.75rem;"><b>Visual issue noted:</b> ${escapeHtml(img.visual_note || '(no description provided)')}</p>`
        : '';

    block.innerHTML = `
      <h3 style="margin-bottom:0.15rem;">${escapeHtml(img.filename)}</h3>
      <p style="color: var(--muted); font-size: 0.85rem; margin: 0 0 0.5rem;">Ambient reference: ${img.ambient_c}°C</p>
      <div class="image-pair">
        <figure><figcaption>Thermal</figcaption><img id="thermal-img-${img.id}" src="${img.image_url}?v=${Date.now()}" alt="Annotated thermal image of ${escapeHtml(img.filename)}" /></figure>
        ${photoHtml}
      </div>
      ${rowsHtml}
      ${comparativeHtml}
      ${noteHtml}
    `;
    imagesEl.appendChild(block);

    block.querySelectorAll('.save-note-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const imageId = btn.dataset.imageId;
        const textarea = block.querySelector(`.visual-note-input[data-image-id="${imageId}"]`);
        const checkbox = block.querySelector(`.visual-anomaly-checkbox[data-image-id="${imageId}"]`);
        const labelInput = block.querySelector(`.asset-label-input[data-image-id="${imageId}"]`);
        const statusEl = block.querySelector(`.note-status[data-image-id="${imageId}"]`);
        btn.disabled = true;
        statusEl.textContent = 'Saving…';
        try {
          await setVisualNote(run.id, imageId, textarea.value, checkbox.checked, labelInput.value);
          await showDetail(run.id);
        } catch (err) {
          statusEl.textContent = err.message;
          btn.disabled = false;
        }
      });
    });

    block.querySelectorAll('.view-trend-btn').forEach((btn) => {
      btn.addEventListener('click', () => showTrend(btn.dataset.label));
    });

    block.querySelectorAll('.recompute-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const imageId = btn.dataset.imageId;
        const index = Number(btn.dataset.index);
        const input = block.querySelector(`.emissivity-input[data-image-id="${imageId}"][data-index="${index}"]`);
        const emissivity = Number(input.value);
        if (!emissivity || emissivity <= 0 || emissivity > 1) {
          alert('Enter an emissivity between 0.01 and 1.');
          return;
        }
        btn.disabled = true;
        const originalText = btn.textContent;
        btn.textContent = '…';
        try {
          await setEmissivityOverride(run.id, imageId, index, emissivity);
          await showDetail(run.id);
        } catch (err) {
          alert(err.message);
          btn.disabled = false;
          btn.textContent = originalText;
        }
      });
    });

    block.querySelectorAll('.exclude-checkbox').forEach((box) => {
      box.addEventListener('change', async () => {
        const imageId = box.dataset.imageId;
        const table = box.closest('table');
        const indices = Array.from(table.querySelectorAll('.exclude-checkbox'))
          .filter((cb) => cb.checked)
          .map((cb) => Number(cb.dataset.index));
        box.disabled = true;
        try {
          await setExcludedHotspots(run.id, imageId, indices);
          await showDetail(run.id);
        } catch (err) {
          box.checked = !box.checked;
          box.disabled = false;
          alert(err.message);
        }
      });
    });
  });

  const skippedEl = document.getElementById('detailSkipped');
  skippedEl.innerHTML = '';
  if (run.skipped.length) {
    skippedEl.innerHTML = '<b style="color: var(--text);">Skipped files</b><br>' +
      run.skipped.map((s) => `<b>${escapeHtml(s.filename)}:</b> ${escapeHtml(s.reason)}`).join('<br>');
  }

  loadAuditLog(run.id);
}

function describeAuditEntry(entry) {
  const when = new Date(entry.created_at).toLocaleString();
  const who = escapeHtml(entry.username);
  const d = entry.detail || {};
  let what;
  if (entry.action === 'exclude_hotspots') {
    what = `changed excluded findings from [${(d.before || []).join(', ')}] to [${(d.after || []).join(', ')}]`;
  } else if (entry.action === 'set_visual_anomaly') {
    const after = d.after || {};
    what = after.visual_anomaly
      ? `flagged a visual anomaly${after.visual_note ? `: "${escapeHtml(after.visual_note)}"` : ''}`
      : 'cleared the visual anomaly flag';
  } else {
    what = escapeHtml(entry.action);
  }
  return `<div style="padding: 0.35rem 0; border-bottom: 1px solid var(--border);"><span style="color: var(--muted);">${when}</span> — <b>${who}</b> ${what}${entry.image_id ? ` <span style="color: var(--muted);">(image #${entry.image_id})</span>` : ''}</div>`;
}

async function loadAuditLog(runId) {
  const el = document.getElementById('auditLog');
  el.textContent = 'Loading…';
  try {
    const resp = await fetch(`/api/history/${runId}/audit-log`, { credentials: 'same-origin' });
    if (!resp.ok) throw new Error('Failed to load activity log');
    const data = await resp.json();
    el.innerHTML = data.entries.length
      ? data.entries.map(describeAuditEntry).join('')
      : '<span style="color: var(--muted);">No reviewer changes recorded for this run.</span>';
  } catch (err) {
    el.textContent = err.message;
  }
}

document.getElementById('backLink').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('detail').style.display = 'none';
  document.getElementById('listPanel').style.display = 'block';
  currentRunId = null;
});

function buildReportFormData() {
  const form = new FormData();
  form.append('report_style', document.getElementById('reportStyle').value);
  ['clientName:client_name', 'siteLocation:site_location', 'auditDate:audit_date', 'inspectorName:inspector_name', 'reportId:report_id']
    .forEach((pair) => {
      const [elId, field] = pair.split(':');
      const v = document.getElementById(elId).value;
      if (v !== '') form.append(field, v);
    });
  return form;
}

document.getElementById('downloadBtn').addEventListener('click', async () => {
  if (!currentRunId) return;
  const btn = document.getElementById('downloadBtn');
  const statusEl = document.getElementById('downloadStatus');
  btn.disabled = true;
  statusEl.textContent = 'Generating PDF…';

  try {
    const resp = await fetch(`/api/history/${currentRunId}/report`, { method: 'POST', body: buildReportFormData(), credentials: 'same-origin' });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      throw new Error(data.detail || 'Report generation failed');
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const disposition = resp.headers.get('Content-Disposition') || '';
    const match = disposition.match(/filename="?([^"]+)"?/);
    const a = document.createElement('a');
    a.href = url;
    a.download = match ? match[1] : 'thermal_report.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    statusEl.textContent = 'Downloaded.';
  } catch (err) {
    statusEl.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('gdocBtn').addEventListener('click', async () => {
  if (!currentRunId) return;
  const btn = document.getElementById('gdocBtn');
  const statusEl = document.getElementById('downloadStatus');
  btn.disabled = true;
  statusEl.textContent = 'Exporting to Google Docs…';

  try {
    const resp = await fetch(`/api/history/${currentRunId}/report/gdoc`, { method: 'POST', body: buildReportFormData(), credentials: 'same-origin' });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      throw new Error(data.detail || 'Google Docs export failed');
    }
    window.open(data.doc_url, '_blank', 'noopener');
    statusEl.textContent = 'Exported to Google Docs.';
  } catch (err) {
    statusEl.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('trendCloseBtn').addEventListener('click', () => {
  document.getElementById('trendDialog').close();
});

function trendDirection(points) {
  const withReadings = points.filter((p) => p.worst_delta_t_c !== null && p.worst_delta_t_c !== undefined);
  if (withReadings.length < 2) return '';
  const first = withReadings[0].worst_delta_t_c;
  const last = withReadings[withReadings.length - 1].worst_delta_t_c;
  const change = last - first;
  if (change > 2) return `<p style="color:#ff9a5c;"><b>⬆ Worsening</b> - ΔT rose ${change.toFixed(1)}°C from the first to most recent reading.</p>`;
  if (change < -2) return `<p style="color:#9ad19a;"><b>⬇ Improving</b> - ΔT fell ${Math.abs(change).toFixed(1)}°C from the first to most recent reading.</p>`;
  return `<p style="color: var(--muted);">Stable - ΔT changed ${change.toFixed(1)}°C across readings.</p>`;
}

async function showTrend(label) {
  const dialog = document.getElementById('trendDialog');
  document.getElementById('trendTitle').textContent = label;
  const contentEl = document.getElementById('trendContent');
  contentEl.textContent = 'Loading…';
  dialog.showModal();
  try {
    const resp = await fetch(`/api/trend?label=${encodeURIComponent(label)}`, { credentials: 'same-origin' });
    if (!resp.ok) throw new Error('Failed to load trend');
    const data = await resp.json();
    if (!data.points.length) {
      contentEl.innerHTML = '<p style="color: var(--muted);">No history for this asset label.</p>';
      return;
    }
    const rowsHtml = data.points.map((p) => `
      <tr>
        <td>${new Date(p.run_created_at).toLocaleDateString()}</td>
        <td>${escapeHtml(p.filename)}</td>
        <td>${p.worst_severity || 'none'}</td>
        <td>${p.worst_delta_t_c ?? '-'}</td>
        <td>${p.worst_max_temp_c ?? '-'}</td>
        <td>${p.visual_anomaly ? 'yes' : ''}</td>
      </tr>`).join('');
    contentEl.innerHTML = `
      ${trendDirection(data.points)}
      <table class="hotspots">
        <thead><tr><th>Date</th><th>File</th><th>Severity</th><th>ΔT (°C)</th><th>Max (°C)</th><th>Visual anomaly</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;
  } catch (err) {
    contentEl.textContent = err.message;
  }
}

loadRuns();
</script>
